# Polski / English (typograficzna) — Kirkouski Typographic v0.10
#
# GENERATED by build_futo_yaml.py — do not edit by hand.
# Source of truth: polish_typographic_full.json
# https://polish-typographic.com
#
# The stock FUTO symbols pages already carry every non-letter character
# this layout uses, so they are deliberately NOT overridden. Only the
# dead keys and the few characters stock lacks live on the alt page.

name: "Polski / English (typograficzna)"
description: "Polish and English on one layout, with dead-key accents and the typographic characters the stock symbols pages lack."
languages: pl en_US
combiners: [DeadKeyPreCombiner, DeadKey]
mirrorInOneHanded: true
rows:
  - letters:
      - "q"
      - "w"
      - {type: base, spec: "e", moreKeys: ["ę"], hint: "ę"}
      - "r"
      - "t"
      - "y"
      - "u"
      - "i"
      - {type: base, spec: "o", moreKeys: ["ó"], hint: "ó"}
      - "p"
  - letters:
      - {type: base, spec: "a", moreKeys: ["ą"], hint: "ą"}
      - {type: base, spec: "s", moreKeys: ["ś", "ß"], hint: "ś"}
      - "d"
      - "f"
      - "g"
      - "h"
      - "j"
      - "k"
      - {type: base, spec: "l", moreKeys: ["ł"], hint: "ł"}
  - letters:
      - $shift
      - {type: base, spec: "z", moreKeys: ["ż", "ź"], hint: "ż"}
      - "x"
      - {type: base, spec: "c", moreKeys: ["ć"], hint: "ć"}
      - "v"
      - "b"
      - {type: base, spec: "n", moreKeys: ["ń"], hint: "ń"}
      - "m"
      - $delete
  - bottom:
      - $symbols
      - ","
      - $alt0
      - $space
      - {type: base, spec: ".", moreKeys: ["…"]}
      - $enter
altPages:
  - - letters:
      - "`|\u0300"   # dead grave
      - "´|\u0301"   # dead acute
      - "ˆ|\u0302"   # dead circumflex
      - "˜|\u0303"   # dead tilde
      - "˘|\u0306"   # dead breve
      - "¨|\u0308"   # dead diaeresis
      - "˚|\u030A"   # dead ring
      - "˝|\u030B"   # dead double-acute
      - "ˇ|\u030C"   # dead caron
      - "¸|\u0327"   # dead cedilla
    - letters:
      - "NBSP|\u00A0"   # NO-BREAK SPACE
      - "✓"   # CHECK MARK
      - "−"   # MINUS SIGN
      - "⌀"   # DIAMETER SIGN
      - "⌃"   # UP ARROWHEAD
      - "NNBSP|\u202F"   # NARROW NO-BREAK SPACE
      - "THIN|\u2009"   # THIN SPACE
      - "SHY|\u00AD"   # SOFT HYPHEN
      - "NB-|‑"   # NON-BREAKING HYPHEN
    - bottom:
      - $alt0
      - ","
      - $space
      - "."
      - $enter
