# Кириллица (типографская) — Kirkouski Typographic v0.10
#
# GENERATED by build_futo_yaml.py — do not edit by hand.
# Source of truth: russian_typographic_full.json
# https://polish-typographic.com
#
# The stock FUTO symbols pages already carry every non-letter character
# this layout uses, so they are deliberately NOT overridden. Only the
# dead keys and the few characters stock lacks live on the alt page.

name: "Кириллица (типографская)"
description: "Russian, Belarusian and Ukrainian on one layout -- the extra letters sit on the base letter you would expect -- with dead-key accents and typographic characters."
languages: ru be uk
combiners: [DeadKeyPreCombiner, DeadKey]
mirrorInOneHanded: true
rows:
  - letters:
      - "й"
      - "ц"
      - {type: base, spec: "у", moreKeys: ["ў"], hint: "ў"}
      - "к"
      - {type: base, spec: "е", moreKeys: ["ё", "є"], hint: "ё"}
      - "н"
      - {type: base, spec: "г", moreKeys: ["ґ"], hint: "ґ"}
      - "ш"
      - "щ"
      - "з"
      - "х"
      - "ъ"
  - letters:
      - "ф"
      - "ы"
      - "в"
      - "а"
      - "п"
      - "р"
      - "о"
      - "л"
      - "д"
      - "ж"
      - "э"
  - letters:
      - $shift
      - "я"
      - "ч"
      - "с"
      - "м"
      - {type: base, spec: "и", moreKeys: ["і", "ї"], hint: "і"}
      - "т"
      - "ь"
      - "б"
      - "ю"
      - $delete
  - bottom:
      - $symbols
      - {type: contextual, fallbackKey: {type: base, spec: ",", attributes: {moreKeyMode: All}}, attributes: {moreKeyMode: All}}
      - $action
      - $space
      - {type: base, spec: "⁜|!code/key_to_alt_0_layout", attributes: {width: Regular, style: Functional, showPopup: false, moreKeyMode: OnlyExplicit}}
      - $period
      - $enter
altPages:
  - - letters:
      - "`|\u0300"   # dead grave
      - "´|\u0301"   # dead acute
      - "ˆ|\u0302"   # dead circumflex
      - "˜|\u0303"   # dead tilde
      - "˘|\u0306"   # dead breve
      - "¨|\u0308"   # dead diaeresis
      - "˚|\u030A"   # dead ring
      - "˝|\u030B"   # dead double-acute
      - "ˇ|\u030C"   # dead caron
      - "¸|\u0327"   # dead cedilla
    - letters:
      - {type: base, spec: "⍽|\u00A0", hint: "nbsp"}   # NO-BREAK SPACE
      - "₽"   # RUBLE SIGN
      - "✓"   # CHECK MARK
      - "₴"   # HRYVNIA SIGN
      - "−"   # MINUS SIGN
      - "⌀"   # DIAMETER SIGN
      - "⌃"   # UP ARROWHEAD
      - {type: base, spec: "⍽|\u202F", hint: "nnbsp"}   # NARROW NO-BREAK SPACE
      - {type: base, spec: "␣|\u2009", hint: "thin"}   # THIN SPACE
      - {type: base, spec: "‧|\u00AD", hint: "shy"}   # SOFT HYPHEN
      - {type: base, spec: "‑|‑", hint: "nbhy"}   # NON-BREAKING HYPHEN
    - bottom:
      - $symbols
      - {type: contextual, fallbackKey: {type: base, spec: ",", attributes: {moreKeyMode: All}}, attributes: {moreKeyMode: All}}
      - $action
      - $space
      - {type: base, spec: "⁜|!code/key_to_alt_0_layout", attributes: {width: Regular, style: Functional, showPopup: false, moreKeyMode: OnlyExplicit}}
      - $period
      - $enter
